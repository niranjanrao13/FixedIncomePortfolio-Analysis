# The name of your automated workflow
name: Build and Test Code

# The trigger: what event starts this workflow?
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# The actual tasks to run
jobs:
  run-tests:
    # The type of virtual machine the runner uses
    runs-on: ubuntu-latest

    # The sequential steps executed inside the runner
    steps:
      # Step 1: Download a copy of your code into the runner
      - name: Check out repository code
        uses: actions/checkout@v4

      # Step 2: Set up the programming environment
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: python -m pip install -e requirements.txt

      # Step 4: Run test suite
      - name: Run test suite
        run: python -m ruff check notebooks

